<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- 1. App Squircle Background & Ambient Glow -->
    <linearGradient id="bg-tile" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131C31" />
      <stop offset="55%" stop-color="#0A101F" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="bg-glow" cx="244" cy="228" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tile-rim" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.45" />
    </linearGradient>

    <!-- 2. Secondary Device Card (Multi-Device Deck) -->
    <linearGradient id="back-deck" x1="184" y1="92" x2="404" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="back-deck-rim" x1="184" y1="92" x2="404" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.20" />
    </linearGradient>

    <!-- 3. Primary Device Chassis & OLED Screen -->
    <linearGradient id="device-chassis" x1="102" y1="96" x2="338" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="chassis-rim" x1="102" y1="96" x2="338" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.60" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.40" />
    </linearGradient>

    <linearGradient id="device-screen" x1="116" y1="110" x2="324" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="screen-sheen" x1="116" y1="110" x2="260" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 4. Android Bot Visor & Pipeline Gradients -->
    <linearGradient id="droid-green" x1="148" y1="138" x2="292" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bar-emerald" x1="176" y1="0" x2="292" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bar-cyan" x1="176" y1="0" x2="266" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="bar-rose" x1="176" y1="0" x2="238" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- 5. Quick-Run (F5) Action Orb -->
    <linearGradient id="run-orb" x1="304" y1="300" x2="392" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="orb-rim" x1="304" y1="294" x2="392" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.35" />
    </linearGradient>

    <!-- Elevation Shadows -->
    <filter id="deck-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.50" />
    </filter>

    <filter id="orb-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. App Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg-tile)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg-glow)" />
  <rect x="33.5" y="33.5" width="445" height="445" rx="106.5" stroke="url(#tile-rim)" stroke-width="3" />

  <!-- 2. Secondary Device Card (Multi-Device Fan-out) -->
  <g filter="url(#deck-shadow)" transform="rotate(10 264 252)">
    <rect x="168" y="96" width="224" height="304" rx="42" fill="url(#back-deck)" />
    <rect x="169.5" y="97.5" width="221" height="301" rx="40.5" stroke="url(#back-deck-rim)" stroke-width="3" />
    <!-- Secondary Screen & Speaker Pill -->
    <rect x="182" y="110" width="196" height="276" rx="30" fill="#070C18" fill-opacity="0.75" />
    <rect x="260" y="122" width="40" height="5" rx="2.5" fill="#38BDF8" fill-opacity="0.45" />
  </g>

  <!-- 3. Primary Cockpit Device -->
  <g filter="url(#deck-shadow)">
    <!-- Outer Metallic Frame -->
    <rect x="102" y="96" width="236" height="320" rx="44" fill="url(#device-chassis)" />
    <rect x="103.5" y="97.5" width="233" height="317" rx="42.5" stroke="url(#chassis-rim)" stroke-width="3" />

    <!-- Inner OLED Screen -->
    <rect x="116" y="110" width="208" height="292" rx="32" fill="url(#device-screen)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="116" y="110" width="208" height="292" rx="32" fill="url(#screen-sheen)" />

    <!-- Top Earpiece Pill -->
    <rect x="200" y="120" width="40" height="4" rx="2" fill="#334155" opacity="0.65" />

    <!-- Android Bot Visor (Aligned to x = 148..292, width = 144) -->
    <g>
      <!-- Antennas -->
      <line x1="184" y1="166" x2="166" y2="138" stroke="url(#droid-green)" stroke-width="10" stroke-linecap="round" />
      <line x1="256" y1="166" x2="274" y2="138" stroke="url(#droid-green)" stroke-width="10" stroke-linecap="round" />

      <!-- Dome Head -->
      <path d="M 148 216 A 72 66 0 0 1 292 216 A 8 8 0 0 1 284 224 H 156 A 8 8 0 0 1 148 216 Z" fill="url(#droid-green)" />

      <!-- Visor Eyes -->
      <circle cx="192" cy="192" r="7.5" fill="#060A14" />
      <circle cx="248" cy="192" r="7.5" fill="#060A14" />
    </g>

    <!-- Stepped Pipeline & Logcat Stream (Aligned to x = 148..292, 18px height / 18px gap) -->
    <!-- Row 1: Build & Launch (Emerald) -->
    <circle cx="157" cy="261" r="9" fill="#34D399" />
    <rect x="176" y="252" width="116" height="18" rx="9" fill="url(#bar-emerald)" />

    <!-- Row 2: Live Logcat Stream (Cyan) -->
    <circle cx="157" cy="297" r="9" fill="#38BDF8" />
    <rect x="176" y="288" width="90" height="18" rx="9" fill="url(#bar-cyan)" />

    <!-- Row 3: Crash / ANR Watch (Rose) -->
    <circle cx="157" cy="333" r="9" fill="#FB7185" />
    <rect x="176" y="324" width="62" height="18" rx="9" fill="url(#bar-rose)" />

    <!-- Bottom Gesture Pill -->
    <rect x="192" y="384" width="56" height="5" rx="2.5" fill="#334155" opacity="0.60" />
  </g>

  <!-- 4. Engineered Negative-Space Knockout Ring + Quick-Run (F5) Orb -->
  <circle cx="346" cy="348" r="62" fill="#080D1A" />
  <g filter="url(#orb-shadow)">
    <circle cx="346" cy="348" r="54" fill="url(#run-orb)" />
    <circle cx="346" cy="348" r="52.5" stroke="url(#orb-rim)" stroke-width="3" />
    <!-- Optically Centered Play Triangle -->
    <path d="M 332 327.5 C 332 323.1 336.8 320.4 340.6 322.7 L 372.6 342.2 C 376.2 344.4 376.2 349.6 372.6 351.8 L 340.6 371.3 C 336.8 373.6 332 370.9 332 366.5 Z" fill="#FFFFFF" />
  </g>
</svg>