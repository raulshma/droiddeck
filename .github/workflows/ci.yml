name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props

      - name: Restore
        run: dotnet restore DroidDeck.slnx

      - name: Build Debug
        run: dotnet build DroidDeck.slnx -c Debug --no-restore

      - name: Test Debug
        run: >-
          dotnet test DroidDeck.slnx
          -c Debug
          --no-build
          --filter "Category!=UI&Category!=Template"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Build Release
        run: dotnet build DroidDeck.slnx -c Release --no-restore

      - name: Test Release
        run: >-
          dotnet test DroidDeck.slnx
          -c Release
          --no-build
          --filter "Category!=UI&Category!=Template"
          --logger "trx;LogFileName=test-results-release.trx"
          --results-directory TestResults

      - name: Test plugin templates
        run: >-
          dotnet test tests/DroidDeck.Plugins.Tests/DroidDeck.Plugins.Tests.csproj
          -c Release
          --no-build
          --filter "Category=Template"
          --logger "trx;LogFileName=test-results-templates.trx"
          --results-directory TestResults

      - name: Pack plugin SDK
        # PackageOutputPath resolves against each project directory, so anchor it to the workspace.
        run: |
          dotnet pack src/DroidDeck.Plugin.Abstractions/DroidDeck.Plugin.Abstractions.csproj -c Release --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts/nuget"
          dotnet pack src/DroidDeck.Plugin.UI/DroidDeck.Plugin.UI.csproj -c Release --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts/nuget"
          dotnet pack templates/DroidDeck.Plugin.Templates/DroidDeck.Plugin.Templates.csproj -c Release --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts/nuget"
          dotnet pack tools/DroidDeck.PluginPack/DroidDeck.PluginPack.csproj -c Release --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts/nuget"

      - name: Publish portable app
        run: >-
          dotnet publish src/DroidDeck.App/DroidDeck.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:PublishReadyToRun=false
          -o artifacts/DroidDeck-portable

      - name: Create portable zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$PWD/artifacts/DroidDeck-portable",
            "$PWD/artifacts/DroidDeck-portable.zip",
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

      - name: Check portable size budget
        run: >-
          dotnet run --project tools/DroidDeck.ReleaseCheck/DroidDeck.ReleaseCheck.csproj
          -c Release
          --no-build
          --
          size --directory artifacts/DroidDeck-portable
          --zip artifacts/DroidDeck-portable.zip
          --label "${{ github.sha }}"
          --json artifacts/release/size.json

      - name: Upload release check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-results
          path: artifacts/release/*.json
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-portable
          path: artifacts/DroidDeck-portable
          if-no-files-found: error

      - name: Upload plugin SDK packages
        uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
