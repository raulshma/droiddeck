name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, gate, and draft release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props

      - name: Set up JDK for code signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare code signing material
        shell: pwsh
        env:
          CODESIGN_JKS_B64: ${{ secrets.WINDOWS_CODESIGN_JKS }}
          CODESIGN_STORE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_STORE_PASSWORD }}
          CODESIGN_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_KEY_PASSWORD }}
          CODESIGN_ALIAS: ${{ secrets.WINDOWS_CODESIGN_ALIAS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('CODESIGN_JKS_B64', 'CODESIGN_STORE_PASSWORD', 'CODESIGN_KEY_PASSWORD', 'CODESIGN_ALIAS')) {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing code signing secret '$name'."
            }
          }

          $jks = Join-Path $env:RUNNER_TEMP 'codesign.jks'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'codesign.cer'
          [IO.File]::WriteAllBytes($jks, [Convert]::FromBase64String($env:CODESIGN_JKS_B64))

          $keytool = Join-Path $env:JAVA_HOME 'bin\keytool.exe'
          if (-not (Test-Path -LiteralPath $keytool)) { throw 'keytool.exe was not found.' }

          # signtool and dotnet nuget sign require PKCS#12 (PFX); the JKS is
          # converted per run and never leaves the runner temp directory.
          & $keytool -importkeystore -noprompt `
            -srckeystore $jks -srcstoretype JKS `
            -srcstorepass $env:CODESIGN_STORE_PASSWORD `
            -srckeypass $env:CODESIGN_KEY_PASSWORD `
            -srcalias $env:CODESIGN_ALIAS `
            -destkeystore $pfx -deststoretype PKCS12 `
            -deststorepass $env:CODESIGN_STORE_PASSWORD `
            -destalias $env:CODESIGN_ALIAS
          if ($LASTEXITCODE -ne 0) { throw 'Converting the JKS keystore to PFX failed.' }

          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfx, $env:CODESIGN_STORE_PASSWORD)
          [IO.File]::WriteAllBytes($cer, $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $fingerprint = $cert.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)

          # The self-signed certificate must be a trust anchor for
          # Get-AuthenticodeSignature and dotnet nuget verify to pass.
          $imported = Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root
          if (-not $imported) { throw 'Importing the signing certificate for verification failed.' }

          "CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CODESIGN_FP=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing certificate ready (SHA-256 fingerprint $fingerprint)."

      - name: Verify tag, version, and source
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' is not a release tag."
          }

          $expected = $env:TAG.Substring(1)
          [xml]$props = Get-Content -Raw Directory.Build.props
          $declared = @($props.Project.PropertyGroup.DroidDeckVersion)[0]
          if ($declared -ne $expected) {
            throw "Tag version '$expected' does not match DroidDeckVersion '$declared'."
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
          if ($head -ne $tagCommit) {
            throw "HEAD is not the '$env:TAG' tag commit."
          }

          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag must point to a commit on main."
          }

          "RELEASE_TAG=$env:TAG" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $prerelease = if ($env:TAG.Contains('-')) { 'true' } else { 'false' }
          "RELEASE_IS_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes '$notes'." }

      - name: Restore
        run: dotnet restore DroidDeck.slnx

      - name: Build Release
        run: dotnet build DroidDeck.slnx -c Release --no-restore

      - name: Test Release
        run: >-
          dotnet test DroidDeck.slnx
          -c Release
          --no-build
          --filter "Category!=UI&Category!=Template"
          --logger "trx;LogFileName=test-results-release.trx"
          --results-directory TestResults

      - name: Test plugin templates
        run: >-
          dotnet test tests/DroidDeck.Plugins.Tests/DroidDeck.Plugins.Tests.csproj
          -c Release
          --no-build
          --filter "Category=Template"
          --logger "trx;LogFileName=test-results-templates.trx"
          --results-directory TestResults

      - name: Pack plugin SDK
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE/artifacts/nuget"
          dotnet pack src/DroidDeck.Plugin.Abstractions/DroidDeck.Plugin.Abstractions.csproj -c Release --no-build -p:PackageOutputPath="$output"
          if ($LASTEXITCODE -ne 0) { throw "Packing DroidDeck.Plugin.Abstractions failed." }
          dotnet pack src/DroidDeck.Plugin.UI/DroidDeck.Plugin.UI.csproj -c Release --no-build -p:PackageOutputPath="$output"
          if ($LASTEXITCODE -ne 0) { throw "Packing DroidDeck.Plugin.UI failed." }
          dotnet pack templates/DroidDeck.Plugin.Templates/DroidDeck.Plugin.Templates.csproj -c Release --no-build -p:PackageOutputPath="$output"
          if ($LASTEXITCODE -ne 0) { throw "Packing DroidDeck.Plugin.Templates failed." }
          dotnet pack tools/DroidDeck.PluginPack/DroidDeck.PluginPack.csproj -c Release --no-build -p:PackageOutputPath="$output"
          if ($LASTEXITCODE -ne 0) { throw "Packing DroidDeck.PluginPack failed." }

      - name: Publish portable app
        shell: pwsh
        run: |
          dotnet publish src/DroidDeck.App/DroidDeck.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:PublishReadyToRun=false `
            -o "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Publishing the portable app failed." }

          # Publish has silently dropped these before, producing an app that only
          # shows the startup failure window. Fail before zipping such an artifact.
          $publish = "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64"
          foreach ($required in @("DroidDeck.pri", "App.xbf", "MainWindow.xbf", "Assets\droiddeck.ico")) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $required))) {
              throw "The portable publish is missing '$required'."
            }
          }
          $viewCount = @(Get-ChildItem -Path (Join-Path $publish "Views") -Filter *.xbf).Count
          if ($viewCount -eq 0) { throw "The portable publish is missing the compiled view XAML." }

      - name: Sign portable binaries
        shell: pwsh
        env:
          CODESIGN_STORE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = @(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^\d+\.\d+' } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1).FullName
          if (-not $signtool) { throw 'signtool.exe was not found.' }

          $publish = "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64"
          $targets = @(Get-ChildItem -Path $publish -Recurse -Include *.exe, *.dll -File)
          if ($targets.Count -eq 0) { throw 'No executables or libraries found to sign.' }

          # Binaries shipped by Microsoft (.NET runtime, Windows App SDK) keep
          # their vendor signatures; re-signing would erase that provenance.
          $pending = @()
          $presigned = @()
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -eq 'NotSigned') { $pending += $target }
            else { $presigned += $target }
          }

          $signArguments = @(
            'sign', '/fd', 'SHA256', '/td', 'SHA256', '/tr', 'http://timestamp.digicert.com',
            '/f', $env:CODESIGN_PFX, '/p', $env:CODESIGN_STORE_PASSWORD,
            '/d', 'DroidDeck', '/du', 'https://github.com/raulshma/droiddeck')

          for ($i = 0; $i -lt $pending.Count; $i += 50) {
            $end = [Math]::Min($i + 49, $pending.Count - 1)
            & $signtool @signArguments @($pending[$i..$end].FullName) | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on batch starting at index $i." }
          }

          $publishRoot = (Resolve-Path $publish).Path
          $presignedList = "artifacts/release/pre-signed.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $presignedList) | Out-Null
          $presigned |
            ForEach-Object { [IO.Path]::GetRelativePath($publishRoot, $_.FullName) } |
            Set-Content -LiteralPath $presignedList -Encoding ascii
          Write-Host "Signed $($pending.Count) binaries; $($presigned.Count) keep their vendor signature."

      - name: Create portable zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64"
          $zip = "artifacts/DroidDeck-$env:RELEASE_VERSION-win-x64.zip"
          if (-not (Test-Path -LiteralPath $source)) { throw "Publish output '$source' is missing." }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $source).Path,
            (Join-Path $env:GITHUB_WORKSPACE $zip),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          $iscc = @(Get-Item 'C:\Program Files (x86)\Inno Setup *\ISCC.exe' |
            Sort-Object { $_.Directory.Name } -Descending |
            Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }

          & $iscc "/DAppVersion=$env:RELEASE_VERSION" `
            "/DAppSource=$env:GITHUB_WORKSPACE/artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64" `
            "/DAppOutput=$env:GITHUB_WORKSPACE/artifacts" `
            "$env:GITHUB_WORKSPACE/packaging/installer/droiddeck.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Compiling the installer failed.' }

          $setup = "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "The installer output '$setup' is missing." }

      - name: Sign Windows installer
        shell: pwsh
        env:
          CODESIGN_STORE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = @(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^\d+\.\d+' } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1).FullName
          if (-not $signtool) { throw 'signtool.exe was not found.' }

          $setup = "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $env:CODESIGN_PFX /p $env:CODESIGN_STORE_PASSWORD `
            /d 'DroidDeck' /du 'https://github.com/raulshma/droiddeck' $setup
          if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed.' }

      - name: Enforce size budget
        shell: pwsh
        run: |
          dotnet run --project tools/DroidDeck.ReleaseCheck/DroidDeck.ReleaseCheck.csproj -c Release --no-build -- `
            size --directory "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64" `
            --zip "artifacts/DroidDeck-$env:RELEASE_VERSION-win-x64.zip" `
            --installer "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe" `
            --label "$env:RELEASE_VERSION $env:GITHUB_SHA no-r2r" `
            --json artifacts/release/size.json
          if ($LASTEXITCODE -ne 0) { throw "The portable size budget failed." }

      - name: Install SBOM tool
        run: dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13

      - name: Generate SBOM
        shell: pwsh
        run: |
          $manifestDirectory = Join-Path $env:RUNNER_TEMP "sbom"
          New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
          $sbomTool = Join-Path $env:USERPROFILE ".dotnet/tools/sbom-tool.exe"
          if (-not (Test-Path -LiteralPath $sbomTool)) { throw "sbom-tool was not installed." }
          & $sbomTool generate `
            -b "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64" `
            -bc . `
            -pn DroidDeck `
            -pv $env:RELEASE_VERSION `
            -ps "DroidDeck contributors" `
            -nsb "https://github.com/raulshma/droiddeck" `
            -m $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }
          Copy-Item `
            -LiteralPath (Join-Path $manifestDirectory "_manifest/spdx_2.2/manifest.spdx.json") `
            -Destination "artifacts/DroidDeck-$env:RELEASE_VERSION.spdx.json"

      - name: Sign NuGet packages
        shell: pwsh
        env:
          CODESIGN_STORE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -Path artifacts/nuget/*.nupkg)
          if ($packages.Count -ne 4) { throw "Expected four SDK packages, found $($packages.Count)." }

          foreach ($package in $packages) {
            dotnet nuget sign $package.FullName `
              --certificate-path $env:CODESIGN_PFX `
              --certificate-password $env:CODESIGN_STORE_PASSWORD `
              --timestamper http://timestamp.digicert.com `
              --hash-algorithm SHA256
            if ($LASTEXITCODE -ne 0) { throw "Signing '$($package.Name)' failed." }
          }

      - name: Verify code signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fingerprint = $env:CODESIGN_FP
          $publish = "artifacts/publish/DroidDeck-$env:RELEASE_VERSION-win-x64"
          $setup = "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe"
          $publishRoot = (Resolve-Path $publish).Path
          $presigned = if (Test-Path "artifacts/release/pre-signed.txt") {
            @(Get-Content "artifacts/release/pre-signed.txt")
          } else {
            @()
          }

          $failures = @()
          $checked = 0
          foreach ($file in @(Get-ChildItem -Path $publish -Recurse -Include *.exe, *.dll -File) + @(Get-Item $setup)) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            $certMatch = $false
            if ($signature.SignerCertificate) {
              $certMatch = $signature.SignerCertificate.GetCertHashString(
                [Security.Cryptography.HashAlgorithmName]::SHA256) -eq $fingerprint
            }
            $vendorSigned = $presigned -contains [IO.Path]::GetRelativePath($publishRoot, $file.FullName)
            $checked++
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
              (-not $certMatch -and -not $vendorSigned)) {
              $failures += "$($file.FullName): status=$($signature.Status), certMatch=$certMatch, " +
                "vendorSigned=$vendorSigned, timestamped=$([bool]$signature.TimeStamperCertificate)"
            }
          }

          foreach ($package in Get-ChildItem -Path artifacts/nuget/*.nupkg) {
            dotnet nuget verify $package.FullName --certificate-fingerprint $fingerprint
            if ($LASTEXITCODE -ne 0) { $failures += "$($package.FullName): NuGet signature verification failed." }
            $checked++
          }

          if ($failures.Count -gt 0) {
            throw "Signature verification failed for $($failures.Count) of $checked assets:`n$($failures -join "`n")"
          }
          Write-Host "Verified $checked signed assets."

      - name: Generate checksums and verify assets
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path artifacts/nuget/*.nupkg | ForEach-Object FullName)
          if ($packages.Count -ne 4) { throw "Expected four SDK packages, found $($packages.Count)." }

          $assets = @(
            "artifacts/DroidDeck-$env:RELEASE_VERSION-win-x64.zip",
            "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe",
            "artifacts/DroidDeck-$env:RELEASE_VERSION.spdx.json"
          ) + $packages

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset '$asset'." }
            if ((Get-Item -LiteralPath $asset).Length -eq 0) { throw "Release asset '$asset' is empty." }
          }

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          $lines | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content -LiteralPath artifacts/SHA256SUMS.txt

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes '$notes'." }

          $assets = @(
            "artifacts/DroidDeck-$env:RELEASE_VERSION-win-x64.zip",
            "artifacts/DroidDeck-$env:RELEASE_VERSION-setup-win-x64.exe",
            "artifacts/DroidDeck-$env:RELEASE_VERSION.spdx.json",
            "artifacts/SHA256SUMS.txt"
          ) + @(Get-ChildItem -Path artifacts/nuget/*.nupkg | ForEach-Object FullName)

          $existingJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release '$tag' is already published; tags and releases are immutable."
            }
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading assets to draft '$tag' failed." }
          } else {
            $arguments = @('release', 'create', $tag) + $assets + @(
              '--draft',
              '--verify-tag',
              '--title', "DroidDeck $tag",
              '--notes-file', $notes
            )
            if ($env:RELEASE_IS_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "Creating draft release '$tag' failed." }
          }
          Write-Host "Draft release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"

      - name: Remove code signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('codesign.jks', 'codesign.pfx', 'codesign.cer')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            artifacts/release/*.json
            artifacts/SHA256SUMS.txt
            artifacts/*.spdx.json
            TestResults/*.trx
          if-no-files-found: ignore
